<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jaro</title>
<style>
  :root { color-scheme: light dark; font: 16px -apple-system, BlinkMacSystemFont, sans-serif;
    --page:#f6f6f8; --ink:#24242b; --soft:#666773; --panel:#fcfcfd; --line:#dedfe5; --halo:#e3e2f5; }
  @media (prefers-color-scheme:dark) { :root { --page:#18181d; --ink:#f1f0f5; --soft:#a5a4b3; --panel:#202027; --line:#363640; --halo:#272542; } }
  * { box-sizing:border-box; }
  body { margin:0; color:var(--ink); background:radial-gradient(ellipse 46rem 22rem at 50% 78%,var(--halo),transparent),var(--page); min-height:100vh; }
  body { padding-top:36px; }
  main { width:min(768px,calc(100% - 48px)); min-height:clamp(288px,49vh,560px); margin:clamp(27px,8vh,88px) auto 0; border:1px solid var(--line); border-radius:29px; background:var(--panel);
    box-shadow:0 14px 50px #2d2c4a08,0 2px 4px #2d2c4a05; padding:36px; display:grid; align-content:center; justify-items:center; text-align:center; }
  h1 { margin:0 0 12px; font-weight:620; letter-spacing:-.035em; font-size:26px; }
  p { color:var(--soft); line-height:1.55; max-width:480px; margin:0 0 18px; }
  button { font:inherit; font-size:14px; font-weight:550; cursor:pointer; color:var(--ink); border:1px solid var(--line); background:var(--panel); min-height:38px; padding:0 17px; border-radius:20px; margin:4px; }
  .primary { background:var(--ink); color:var(--panel); }
  button:focus-visible { outline:3px solid #8e8dd5; outline-offset:2px; }
  progress { width:min(350px,100%); height:6px; accent-color:#7773b6; margin:4px 0 15px; }
  [hidden] { display:none !important; }
</style>
<main aria-live="polite">
  <h1 id="title">Opening your workspace…</h1>
  <p id="detail">Starting the local engine.</p>
  <progress id="progress" hidden></progress>
  <div id="choices" hidden>
    <button class="primary" id="download">Download models</button>
    <button id="folder">Use existing models…</button>
  </div>
  <button id="retry" hidden>Try again</button>
</main>
<script>
  const byId = id => document.getElementById(id);
  const title = byId("title"), detail = byId("detail"), choices = byId("choices"), retry = byId("retry"), progress = byId("progress");
  let messages = {};
  function copy(element, source) {
    element.dataset.message = source;
    element.textContent = Object.hasOwn(messages, source) ? messages[source] : source;
  }
  for (const element of [title, detail, retry, byId("download"), byId("folder")]) copy(element, element.textContent);
  window.zero?.invoke("jard.interfaceLanguage", {action:"status"}).then(state => {
    messages = state.messages ?? {};
    document.documentElement.lang = state.resolved ?? "en";
    for (const element of document.querySelectorAll("[data-message]")) copy(element, element.dataset.message);
  }).catch(() => {});
  function choose() {
    copy(title, "Set up on this Mac");
    copy(detail, "Download 3.86 GB of speech and writing models once, or choose your existing Jard model folder. After setup, you can record and transcribe offline.");
    choices.hidden = false;
    progress.hidden = true;
    retry.hidden = true;
  }
  async function request(command, args) {
    choices.hidden = true;
    retry.hidden = true;
    try {
      const state = await window.zero.invoke("jard." + command, args);
      if (!state?.ready) choose();
    } catch (error) {
      copy(title, "Couldn’t open the workspace");
      copy(detail, error.message);
      retry.hidden = false;
      progress.hidden = true;
    }
  }
  function install(source) {
    copy(title, "Preparing your models…");
    copy(detail, source === "folder" ? "Choose the folder containing your existing model files." : "Starting the download.");
    request("setup", {source});
  }
  window.addEventListener("native-sdk:setup", ({detail: info}) => {
    if (info.event !== "progress") return;
    progress.hidden = false;
    progress.max = info.total;
    progress.value = info.completed;
    delete detail.dataset.message;
    detail.textContent = Math.floor(info.completed / info.total * 100) + "% · " + info.file;
  });
  byId("download").onclick = () => install("download");
  byId("folder").onclick = () => install("folder");
  retry.onclick = () => request("prepare", {});
  request("prepare", {});
</script>
</html>
