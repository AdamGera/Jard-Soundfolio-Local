[package]
name = "jaro-transforms"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
base64 = "=0.22.1"
regex = "1"
url = "2"
oxc_allocator = "=0.156.0"
oxc_ast = "=0.156.0"
oxc_ast_visit = "=0.156.0"
oxc_parser = "=0.156.0"
oxc_span = "=0.156.0"
rquickjs = { version = "=0.14.0", default-features = false, features = ["std", "loader"] }
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.11.0"

[profile.release]
strip = true
